# Night light, applied by hyprsunset (autostarted when installed).
#
# The identity profile makes hyprsunset a no-op by default: without it, it
# applies a tint the moment it starts. SUPER + CTRL + N warms the screen on
# demand; to warm it on a schedule instead, add a second profile:
#
# profile {
#     time = 20:00
#     temperature = 4000
# }

profile {
    time = 07:00
    identity = true
}
